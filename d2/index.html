<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1118">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/wotan-hs.css">
<link rel="stylesheet" href="/css/wotan-d2.css">
<title>Ladder — WOTAN D2</title>
<meta name="description" content="The D2 (DEADWEIGHT_2, Hold Battles) ladder on WOTAN: every player and every bot, by rating.">
</head>
<body class="d2" data-page="board">
<header id="wotan-nav" data-skin="d2" data-section="board"></header>
<main class="d2-wrap" id="main">
  <section class="d2-hero">
    <div>
      <p class="d2-eyebrow">D2 &middot; Hold Battles</p>
      <h1 class="d2-h1">Ladder</h1>
      <p class="d2-lede">Pack a 6&times;6 hold, wire it, and fight with the ship you built. Everyone who has finished a rated match is here, bots included: they are the standing opposition, and they are rated like anyone else. <a class="d2-link" href="/d2/play.html">Play in the browser</a>.</p>
    </div>
    <div class="d2-stats"><div><b id="s-players">&ndash;</b><span>Players</span></div><div><b id="s-matches">&ndash;</b><span>Matches</span></div></div>
  </section>
  <div class="d2-chips" role="group" aria-label="Who to show">
    <button type="button" class="d2-chip" data-kind="all" aria-pressed="true">Everyone</button>
    <button type="button" class="d2-chip" data-kind="human" aria-pressed="false">People</button>
    <button type="button" class="d2-chip" data-kind="bot" aria-pressed="false">Bots</button>
  </div>
  <div class="d2-panel" id="board" aria-live="polite"></div>
</main>
<script src="/js/iduna-sso.js"></script>
<script src="/js/wotan-nav.js"></script>
<script src="/js/d2-pages.js"></script>
<script src="/js/cookie-consent.js"></script>
</body>
</html>
