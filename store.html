<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOTAN Hat Store &mdash; EINHORN_INDUSTRIAL</title>
<meta name="description" content="Buy BRAWLPIT cosmetic hats with your GFD Flow balance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/wotan-theme.css">
<style>
  label .hint { font-weight: 400; opacity: 0.75; text-transform: none; letter-spacing: 0; }
  /* WOTAN-997: password field + its own show/hide ("eye") toggle, side by side. */
  .pw-row { display: flex; gap: 0.4rem; align-items: stretch; }
  .pw-row input { flex: 1; min-width: 0; }
  .eye-toggle {
    margin-top: 0; padding: 0 0.6rem; border-radius: 8px; border: 2px solid var(--border);
    background: var(--bg-card); color: var(--fg-dim); font-size: 1rem; cursor: pointer;
    line-height: 1;
  }
  .eye-toggle.active { color: var(--violet-bright); border-color: var(--violet-bright); }
  .hat-row {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.85rem 0; border-bottom: 1px solid var(--border);
  }
  .hat-row:last-child { border-bottom: none; }
  .hat-name { font-weight: 700; }
  .hat-desc { font-size: 0.85rem; color: var(--fg-dim); }
  .hat-cost { font-family: var(--font-display); font-size: 0.85rem; font-weight: 700; color: var(--gold-bright); white-space: nowrap; }
  .badge { color: var(--ok); border: 1px solid var(--ok); }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/">WOTAN<small>EINHORN_INDUSTRIAL</small></a>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Home</a>
      <a href="/decks.html">Draft Decks</a>
      <a href="/store.html" aria-current="page">Hat Store</a>
      <a href="/friends.html">Friends &amp; Duels</a>
    </nav>
  </div>
</header>
<div class="wrap">
  <h1>Hat Store</h1>
  <p class="tagline">Spend your GFD Flow on a BRAWLPIT cosmetic hat.</p>

  <!-- Login/register (WOTAN_HAT_STORE_NORTHSTAR.md Phase 2): real IDUNA email+password auth,
       POST /api/v1/auth/email/login or /register, proxied same-origin so no CORS/cross-origin
       bearer-token dance is needed (see ops/nginx-wotan.conf's own /api/ block). The returned
       JWT is kept in localStorage only -- per-viewer, never sent anywhere but back to this same
       IDUNA instance as an Authorization: Bearer header. -->
  <div class="card" id="auth-card">
    <p id="auth-status">Log in with your WOTAN/IDUNA account to see the catalog and buy hats.</p>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username">
    <label for="password">Password</label>
    <div class="pw-row">
      <input type="password" id="password" autocomplete="current-password">
      <button type="button" class="eye-toggle" id="password-eye" aria-label="Show password" title="Show password">&#128065;</button>
    </div>
    <!-- WOTAN-997 ("have them confirm the password type it twice"): only enforced on register
         (see doAuth('register') below) -- a returning login only ever needs the one real
         password, so this field is validated, never required, for the login path. Shown
         always rather than only after clicking "Register instead" -- avoids a second click just
         to reveal it, and a login attempt with something typed here is simply ignored. -->
    <label for="confirm-password">Confirm Password <span class="hint">(new accounts only)</span></label>
    <div class="pw-row">
      <input type="password" id="confirm-password" autocomplete="new-password">
      <button type="button" class="eye-toggle" id="confirm-password-eye" aria-label="Show password" title="Show password">&#128065;</button>
    </div>
    <div>
      <button id="login-btn">Log in</button>
      <button class="secondary" id="register-btn">Register instead</button>
      <button class="secondary" id="logout-btn" hidden>Log out</button>
    </div>
    <div class="msg" id="auth-msg"></div>
  </div>

  <div class="card" id="character-card" hidden>
    <p id="character-status">Resolving your GFD character&hellip;</p>
  </div>

  <div class="card" id="catalog-card" hidden>
    <p><strong>Catalog</strong> &mdash; ordered by Flow cost.</p>
    <div id="catalog-list"></div>
    <div class="msg" id="catalog-msg"></div>
  </div>

  <div class="card" id="owned-card" hidden>
    <p><strong>Your hats</strong></p>
    <div id="owned-list"></div>
    <div class="msg" id="owned-msg"></div>
  </div>
</div>

<script>
// Real, honest, client-side only -- no framework, matching WOTAN's own index.html convention.
// All calls go through this same origin's /api/ proxy (see ops/nginx-wotan.conf) straight to
// IDUNA's real MMO/hats endpoints (BRAWLPIT/docs/WOTAN_HAT_STORE_NORTHSTAR.md Phase 2).

function getToken() { try { return localStorage.getItem('wotan_token') || ''; } catch (e) { return ''; } }
function setToken(t) { try { if (t) localStorage.setItem('wotan_token', t); else localStorage.removeItem('wotan_token'); } catch (e) {} }
function getPlayerID() { try { return localStorage.getItem('wotan_player_id') || ''; } catch (e) { return ''; } }
function setPlayerID(p) { try { if (p) localStorage.setItem('wotan_player_id', p); else localStorage.removeItem('wotan_player_id'); } catch (e) {} }

let characterID = '';

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  const token = getToken();
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch('/api/v1' + path, opts);
  let body = null;
  try { body = await res.json(); } catch (e) { /* no body, e.g. 204 */ }
  if (!res.ok) {
    const msg = (body && (body.error || body.message)) || res.statusText || ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return body;
}

function setAuthMsg(text, kind) {
  const el = document.getElementById('auth-msg');
  el.textContent = text || '';
  el.className = 'msg' + (kind ? ' ' + kind : '');
}

async function doAuth(endpoint) {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { setAuthMsg('Email and password required.', 'error'); return; }
  // WOTAN-997: confirm-password is only a real requirement for a NEW account -- a returning
  // login only ever needs the one real password on file, so this check is scoped to the
  // register endpoint specifically, not applied to login even if something's typed there.
  if (endpoint === 'register') {
    const confirm = document.getElementById('confirm-password').value;
    if (password !== confirm) { setAuthMsg('Passwords do not match.', 'error'); return; }
  }
  setAuthMsg('Working…');
  try {
    const body = await api('/auth/email/' + endpoint, { method: 'POST', body: JSON.stringify({ email, password }) });
    setToken(body.token);
    setPlayerID(body.player_id);
    setAuthMsg('Logged in as ' + (body.display_name || email) + '.', 'ok');
    await afterLogin();
  } catch (e) {
    setAuthMsg(e.message, 'error');
  }
}

function logout() {
  setToken('');
  setPlayerID('');
  characterID = '';
  document.getElementById('character-card').hidden = true;
  document.getElementById('catalog-card').hidden = true;
  document.getElementById('owned-card').hidden = true;
  document.getElementById('logout-btn').hidden = true;
  setAuthMsg('Logged out.');
}

async function resolveCharacter() {
  const el = document.getElementById('character-card');
  const status = document.getElementById('character-status');
  el.hidden = false;
  try {
    const c = await api('/characters/by-player/' + encodeURIComponent(getPlayerID()));
    characterID = c.character_id;
    status.textContent = 'Playing as ' + (c.name || characterID) + ' — ' + c.gold_balance + ' Flow.';
    document.getElementById('catalog-card').hidden = false;
    document.getElementById('owned-card').hidden = false;
    await Promise.all([loadCatalog(), loadOwned()]);
  } catch (e) {
    // Real, honest: a WOTAN account with no GFD character yet has nothing to spend and nothing
    // to wear a hat -- not an error, just the real current state, matching OKEMILY/hats.html's
    // own "not live yet" honesty convention rather than a scary/red error message.
    status.textContent = 'No GFD character found for this account yet -- create one in GFD Town first, then come back here.';
  }
}

async function afterLogin() {
  document.getElementById('logout-btn').hidden = false;
  await resolveCharacter();
}

async function loadCatalog() {
  const list = document.getElementById('catalog-list');
  const msg = document.getElementById('catalog-msg');
  list.innerHTML = '';
  msg.textContent = '';
  try {
    const [hats, owned] = await Promise.all([
      api('/hats'),
      api('/characters/' + encodeURIComponent(characterID) + '/hats'),
    ]);
    const ownedIDs = new Set(owned.map(o => o.hat_id));
    hats.forEach(h => {
      const row = document.createElement('div');
      row.className = 'hat-row';
      const already = ownedIDs.has(h.hat_id);
      row.innerHTML =
        '<div><div class="hat-name">' + escapeHtml(h.name) + (already ? '<span class="badge">Owned</span>' : '') + '</div>' +
        '<div class="hat-desc">' + escapeHtml(h.description || '') + '</div></div>' +
        '<div class="hat-cost">' + h.flow_cost + ' Flow</div>';
      const btn = document.createElement('button');
      btn.textContent = already ? 'Owned' : 'Buy';
      btn.disabled = already;
      btn.onclick = () => buyHat(h.hat_id, btn);
      row.appendChild(btn);
      list.appendChild(row);
    });
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
  }
}

async function buyHat(hatID, btn) {
  btn.disabled = true;
  const msg = document.getElementById('catalog-msg');
  msg.textContent = '';
  try {
    await api('/characters/' + encodeURIComponent(characterID) + '/hats/buy', {
      method: 'POST', body: JSON.stringify({ hat_id: hatID }),
    });
    msg.textContent = 'Purchased.';
    msg.className = 'msg ok';
    await Promise.all([loadCatalog(), loadOwned(), resolveCharacter()]);
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
    btn.disabled = false;
  }
}

async function loadOwned() {
  const list = document.getElementById('owned-list');
  const msg = document.getElementById('owned-msg');
  list.innerHTML = '';
  msg.textContent = '';
  try {
    const owned = await api('/characters/' + encodeURIComponent(characterID) + '/hats');
    if (owned.length === 0) {
      list.innerHTML = '<p class="hat-desc">No hats yet.</p>';
      return;
    }
    owned.forEach(o => {
      const row = document.createElement('div');
      row.className = 'hat-row';
      row.innerHTML =
        '<div><div class="hat-name">' + escapeHtml(o.name) + (o.equipped ? '<span class="badge">Equipped</span>' : '') + '</div>' +
        '<div class="hat-desc">' + escapeHtml(o.description || '') + '</div></div>';
      const btn = document.createElement('button');
      btn.textContent = o.equipped ? 'Equipped' : 'Equip';
      btn.disabled = o.equipped;
      btn.className = 'secondary';
      btn.onclick = () => equipHat(o.hat_id, btn);
      row.appendChild(btn);
      list.appendChild(row);
    });
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
  }
}

async function equipHat(hatID, btn) {
  btn.disabled = true;
  const msg = document.getElementById('owned-msg');
  msg.textContent = '';
  try {
    await api('/characters/' + encodeURIComponent(characterID) + '/hats/equip', {
      method: 'PATCH', body: JSON.stringify({ hat_id: hatID }),
    });
    msg.textContent = 'Equipped.';
    msg.className = 'msg ok';
    await Promise.all([loadCatalog(), loadOwned()]);
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
    btn.disabled = false;
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

document.getElementById('login-btn').addEventListener('click', () => doAuth('login'));
document.getElementById('register-btn').addEventListener('click', () => doAuth('register'));
document.getElementById('logout-btn').addEventListener('click', logout);

// WOTAN-997 ("have the field like hidden with the eye thing"): toggles one password input
// between type="password" and type="text", independent per field (password vs
// confirm-password each get their own real toggle state, not a shared one).
function wirePasswordEye(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  btn.addEventListener('click', () => {
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.classList.toggle('active', !showing);
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    btn.title = showing ? 'Show password' : 'Hide password';
  });
}
wirePasswordEye('password', 'password-eye');
wirePasswordEye('confirm-password', 'confirm-password-eye');

// Real page-load bootstrap: if a token is already sitting in localStorage from a prior visit,
// skip straight to resolving the character/catalog instead of forcing a fresh login every time.
if (getToken() && getPlayerID()) {
  document.getElementById('logout-btn').hidden = false;
  setAuthMsg('Restoring your session…');
  afterLogin().then(() => setAuthMsg('')).catch(() => {});
} else if (new URLSearchParams(location.search).get('signup') === '1') {
  // GFD-UA-001: the GFD client's own login screen opens this page with ?signup=1 (Ctrl+Alt+S,
  // "no account? sign up") -- real, small hint so landing here from that link puts the cursor
  // straight into the email field instead of making someone click into it themselves.
  document.getElementById('email').focus();
  setAuthMsg('Fill in the fields below, then click "Register instead" to create your account.');
}
</script>
</body>
</html>
