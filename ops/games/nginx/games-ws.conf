# The game box's only HTTP door: wss for browser games, reached ONLY by the WOTAN box (ufw allows 8443 from its IP).
# TLS is a Cloudflare Origin CA cert for play.okemily.com; WOTAN's nginx verifies it against Cloudflare's origin root.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
server {
    listen 8443 ssl;
    server_name play.okemily.com;
    ssl_certificate     /etc/ssl/games/play.pem;
    ssl_certificate_key /etc/ssl/games/play.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /health { return 200 "ok\n"; }
    location /GFD/ws {
        proxy_pass http://127.0.0.1:8480;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / { return 404; }
}
