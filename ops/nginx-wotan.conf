server {
    server_name wotan.okemily.com;

    root /var/www/wotan;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # IDUNA API proxy (added 2026-09-04, WOTAN_HAT_STORE_NORTHSTAR.md Phase 2) -- same-origin
    # path for store.html's login + hat catalog/buy/equip calls, matching okemily.com's own
    # /api/ proxy pattern (see OKEMILY/ops/nginx-okemily.conf) so the browser never needs CORS
    # or a cross-origin bearer-token dance.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
