server {
    server_name wotan.okemily.com;

    root /var/www/wotan;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The internet-of-SHANKPIT shim (2026-11-03): the citizens' DEADWEIGHT ladder as the SHANKPIT
    # process publishes it (SHANKPIT/packages/simulation/dw_net.c -> shankpit_netd, schema 1).
    # Proxied, never copied, so /shankpit-citizens.html always reads the live world. shankpit_netd
    # binds loopback on the box that runs the world; on the cluster this upstream has to be THAT
    # host's address -- the deployment step is not built yet, and is named in the repo's CLAUDE.md.
    # Must stay above the general /api/ block (longest prefix wins, but keeping it first reads right).
    location /api/v1/shankpit-net/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # IDUNA API proxy (added 2026-09-04, WOTAN_HAT_STORE_NORTHSTAR.md Phase 2) -- same-origin
    # path for store.html's login + hat catalog/buy/equip calls, matching okemily.com's own
    # /api/ proxy pattern (see OKEMILY/ops/nginx-okemily.conf) so the browser never needs CORS
    # or a cross-origin bearer-token dance.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DEADWEIGHT native-wasm client WebSocket bridge (added for wotan.okemily.com/DEADWEIGHT
    # hosting, DEADWEIGHT/docs/NATIVE_WASM_CLIENT_NORTHSTAR.md). dw-ws-bridge.service
    # (DEADWEIGHT/ops/systemd/dw-ws-bridge.service) is loopback-only by design -- this is the
    # ONLY real public path in, terminating wss:// with this vhost's existing cert same as every
    # other location here. The static client bundle itself (index.html/dist/) needs no location
    # block of its own -- it's served by the existing `location /` try_files rule once deployed
    # under /var/www/wotan/DEADWEIGHT/.
    location /DEADWEIGHT/ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
