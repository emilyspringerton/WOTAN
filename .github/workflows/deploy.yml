name: Build and push image

# K8S-CD-01 (same pattern as IDUNA's deploy.yml): build the static-site image and push it to Artifact
# Registry on every push to main, auth via Workload Identity (no stored key; see
# EMILY/gitops/CI_SETUP.md). The in-cluster gitops-autodeploy CronJob notices the newest `wotan` tag,
# bumps WOTAN_TAG in EMILY/gitops/tags.env, re-renders the PARENA manifests and gitops-sync applies
# them -- this workflow never talks to the cluster.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

concurrency:
  group: wotan-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Always ship the DEADWEIGHT client built from DEADWEIGHT main (not the committed copy), so
      # a WOTAN-only push never reverts a DEADWEIGHT deploy.
      - uses: actions/checkout@v4
        with:
          repository: emilyspringerton/DEADWEIGHT
          path: DEADWEIGHT-src

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build DEADWEIGHT web client
        run: sudo apt-get update && sudo apt-get install -y clang lld && DEADWEIGHT-src/scripts/build-web.sh "$RUNNER_TEMP/dw-web"

      - name: Auth to GCP (Workload Identity, no stored key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/532442865445/locations/global/workloadIdentityPools/github/providers/github' }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT || 'github-ci@project-d24a71e9-2daf-4b2d-917.iam.gserviceaccount.com' }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build + push
        env:
          DEADWEIGHT_WEB_DIR: ${{ runner.temp }}/dw-web
        run: scripts/build-image.sh "$(git rev-parse --short HEAD)"
