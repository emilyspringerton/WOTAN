<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e1a14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/wotan-hs.css">
<link rel="stylesheet" href="/css/wotan-rg.css">
<title>Player — WOTAN Redgarden</title>
<meta name="description" content="A REDGARDEN player profile on WOTAN.">
</head>
<body class="rg" data-page="profile">
<header id="wotan-nav" data-skin="rg" data-section="board"></header>
<main class="rg-wrap" id="main">
  <section class="rg-hero">
    <div>
      <p class="rg-eyebrow">Redgarden player</p>
      <h1 class="rg-h1" id="p-name">Player</h1>
    </div>
    <div class="rg-stats">
      <div><b id="p-w">–</b><span>Wins</span></div><div><b id="p-l">–</b><span>Losses</span></div>
      <div><b id="p-m">–</b><span>Played</span></div><div><b id="p-wr">–</b><span>Win rate</span></div>
    </div>
  </section>
  <div id="profile" aria-live="polite"></div>
</main>
<script src="/js/iduna-sso.js"></script>
<script src="/js/wotan-nav.js"></script>
<script src="/js/rg-pages.js"></script>
</body>
</html>
